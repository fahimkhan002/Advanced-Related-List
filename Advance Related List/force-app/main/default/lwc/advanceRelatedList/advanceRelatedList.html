<template>
    <article class="slds-card arl-card">
        <!-- Header -->
        <div class="slds-card__header slds-grid slds-wrap slds-grid_vertical-align-center slds-gutters_x-small">
            <header class="slds-media slds-media_center slds-col slds-grow">
                <div class="slds-media__figure">
                    <lightning-icon icon-name={iconName} size="small" style={iconStyle}></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title" data-id="heading" tabindex="-1">
                        <span class="slds-truncate" title={title}>{title}</span>
                        <span class="slds-m-left_xx-small" data-id="count">{countLabel}</span>
                    </h2>
                </div>
            </header>
            <div class="slds-col slds-no-flex slds-grid slds-wrap slds-grid_vertical-align-center arl-toolbar">
                <template lwc:if={hasSearchableColumns}>
                    <lightning-input
                        class="arl-search slds-m-right_x-small"
                        data-id="search"
                        type="search"
                        label={searchLabel}
                        variant="label-hidden"
                        placeholder="Search this list"
                        value={searchInput}
                        onchange={handleSearchInput}
                    ></lightning-input>
                </template>
                <template lwc:if={hasFilterableColumns}>
                    <lightning-button-icon-stateful
                        data-id="filter-toggle"
                        icon-name="utility:filterList"
                        selected={showFilters}
                        alternative-text={filterButtonLabel}
                        title={filterButtonLabel}
                        onclick={handleToggleFilters}
                    ></lightning-button-icon-stateful>
                </template>
                <lightning-button-group class="slds-m-left_x-small">
                    <template lwc:if={hasFlow}>
                        <lightning-button data-id="flow" label={flowTitle} icon-name="utility:flow" onclick={handleRunFlow}></lightning-button>
                    </template>
                    <template lwc:if={canCreate}>
                        <lightning-button data-id="new" label="New" onclick={handleNew}></lightning-button>
                    </template>
                    <template lwc:if={canBulkDelete}>
                        <lightning-button
                            data-id="bulk-delete"
                            label={bulkDeleteLabel}
                            variant="destructive-text"
                            disabled={bulkDeleteDisabled}
                            onclick={handleBulkDelete}
                        ></lightning-button>
                    </template>
                </lightning-button-group>
                <lightning-button-icon
                    class="slds-m-left_x-small"
                    data-id="refresh"
                    icon-name="utility:refresh"
                    alternative-text="Refresh list"
                    title="Refresh list"
                    onclick={handleRefresh}
                ></lightning-button-icon>
                <template lwc:if={showSettingsMenu}>
                    <lightning-button-menu
                        class="slds-m-left_xx-small"
                        data-id="settings"
                        icon-name="utility:settings"
                        alternative-text="List settings"
                        menu-alignment="right"
                        onselect={handleSettingsSelect}
                    >
                        <lightning-menu-item value="resetWidths" label="Reset column widths"></lightning-menu-item>
                    </lightning-button-menu>
                </template>
            </div>
        </div>

        <!-- Filter editor -->
        <template lwc:if={showFilters}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <c-filter-panel columns={filterableColumns} logic={filterLogic} filters={filters} onapply={handleFilterApply} oncancel={handleFilterCancel}></c-filter-panel>
            </div>
        </template>

        <!-- Active filters -->
        <template lwc:if={hasActiveFilters}>
            <div class="slds-p-horizontal_medium slds-p-bottom_x-small slds-grid slds-wrap slds-grid_vertical-align-center" data-id="active-filters">
                <span class="slds-text-body_small slds-m-right_x-small">{logicText}:</span>
                <ul class="slds-listbox slds-listbox_horizontal" aria-label="Active filters">
                    <template for:each={activeFilterPills} for:item="pill">
                        <li key={pill.key} class="slds-listbox-item">
                            <lightning-pill label={pill.label} data-index={pill.index} onremove={handleRemoveFilter}></lightning-pill>
                        </li>
                    </template>
                </ul>
                <lightning-button variant="base" data-id="clear-all" class="slds-m-left_x-small" label="Clear all" onclick={handleClearAll}></lightning-button>
            </div>
        </template>

        <div class="slds-card__body slds-card__body_inner arl-body" aria-busy={ariaBusy}>
            <div class="slds-assistive-text" aria-live="polite" data-id="live">{announcement}</div>

            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading records" size="small"></lightning-spinner>
            </template>

            <!-- Error and configuration states -->
            <template lwc:if={isConfigError}>
                <div class="slds-scoped-notification slds-theme_warning" role="status" data-id="config-error">
                    <p class="slds-text-title_bold">This list isn't set up correctly</p>
                    <p>{message}</p>
                    <p class="slds-text-body_small">Ask your Salesforce administrator to check this component's settings.</p>
                </div>
            </template>
            <template lwc:if={isAccessError}>
                <div class="slds-scoped-notification slds-theme_info" role="status" data-id="access-error">
                    <p class="slds-text-title_bold">You can't view this list</p>
                    <p>{message}</p>
                </div>
            </template>
            <template lwc:if={isInputError}>
                <div class="slds-scoped-notification slds-theme_warning" role="alert" data-id="input-error">
                    <p>{message}</p>
                    <lightning-button variant="base" label="Clear search and filters" onclick={handleClearAll}></lightning-button>
                </div>
            </template>
            <template lwc:if={isGenericError}>
                <div class="slds-scoped-notification slds-theme_error" role="alert" data-id="error">
                    <p>{message}</p>
                    <lightning-button variant="base" label="Try again" onclick={handleRetry}></lightning-button>
                </div>
            </template>

            <template lwc:if={hasRowErrors}>
                <div class="slds-scoped-notification slds-theme_warning slds-m-bottom_x-small" role="alert" data-id="row-errors">
                    <p class="slds-text-title_bold">Some records couldn't be deleted. They are still selected.</p>
                    <ul class="slds-list_dotted">
                        <template for:each={rowErrors} for:item="rowError">
                            <li key={rowError.id}>{rowError.text}</li>
                        </template>
                    </ul>
                    <lightning-button variant="base" label="Dismiss" onclick={handleDismissRowErrors}></lightning-button>
                </div>
            </template>

            <template lwc:if={hasOmittedColumns}>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small" data-id="omitted">
                    Some columns are hidden because you don't have access to those fields.
                </p>
            </template>

            <!-- Empty and no-match states -->
            <template lwc:if={isEmpty}>
                <p class="slds-p-vertical_medium slds-text-align_center slds-text-color_weak" data-id="empty">{emptyText}</p>
            </template>
            <template lwc:if={isNoMatch}>
                <div class="slds-p-vertical_medium slds-text-align_center" data-id="no-match">
                    <p class="slds-text-color_weak">No records match your search or filters.</p>
                    <lightning-button variant="base" label="Clear search and filters" onclick={handleClearAll}></lightning-button>
                </div>
            </template>

            <!-- Rows -->
            <template lwc:if={hasRows}>
                <template lwc:if={isSmall}>
                    <template lwc:if={hasSortOptions}>
                        <div class="slds-grid slds-gutters_x-small slds-m-bottom_x-small" data-id="small-sort">
                            <lightning-combobox class="slds-col" label="Sort by" value={sortKey} options={sortOptions} onchange={handleSmallSortField}></lightning-combobox>
                            <lightning-combobox class="slds-col" label="Order" value={sortDirection} options={directionOptions} onchange={handleSmallSortDirection}></lightning-combobox>
                        </div>
                    </template>
                    <ul class="slds-has-dividers_bottom-space" data-id="cards" aria-label={title}>
                        <template for:each={cards} for:item="card">
                            <li key={card.id} class="slds-item">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                                    <a href="#" class="slds-text-heading_small" data-id={card.id} onclick={handleCardOpen}>{card.title}</a>
                                    <lightning-button-menu
                                        data-id={card.id}
                                        alternative-text={card.menuLabel}
                                        icon-size="x-small"
                                        menu-alignment="right"
                                        onselect={handleCardAction}
                                    >
                                        <template for:each={rowActions} for:item="action">
                                            <lightning-menu-item key={action.name} value={action.name} label={action.label}></lightning-menu-item>
                                        </template>
                                    </lightning-button-menu>
                                </div>
                                <dl class="slds-list_horizontal slds-wrap">
                                    <template for:each={card.details} for:item="detail">
                                        <div key={detail.key} class="slds-grid slds-size_1-of-1">
                                            <dt class="slds-item_label slds-text-color_weak slds-truncate">{detail.label}</dt>
                                            <dd class="slds-item_detail">{detail.value}</dd>
                                        </div>
                                    </template>
                                </dl>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <div class="arl-table">
                        <lightning-datatable
                            key-field="id"
                            data={rows}
                            columns={datatableColumns}
                            show-row-number-column
                            row-number-offset={rowNumberOffset}
                            hide-checkbox-column={hideCheckboxColumn}
                            max-row-selection={maxRowSelection}
                            selected-rows={selectedIds}
                            sorted-by={datatableSortedBy}
                            sorted-direction={sortDirection}
                            default-sort-direction="asc"
                            onsort={handleSort}
                            onrowselection={handleRowSelection}
                            onrowaction={handleRowAction}
                            oncolumnresize={handleColumnResize}
                        ></lightning-datatable>
                    </div>
                </template>
            </template>

            <!-- Pagination -->
            <template lwc:if={showPagination}>
                <nav class="slds-grid slds-grid_align-center slds-grid_vertical-align-center slds-m-top_small" aria-label="Pagination">
                    <lightning-button data-id="prev" label="Previous" icon-name="utility:chevronleft" onclick={handlePrevious} disabled={isFirstPage}></lightning-button>
                    <span class="slds-p-horizontal_medium" data-id="page">{pageText}</span>
                    <lightning-button
                        data-id="next"
                        label="Next"
                        icon-name="utility:chevronright"
                        icon-position="right"
                        onclick={handleNext}
                        disabled={isLastPage}
                    ></lightning-button>
                </nav>
            </template>
            <template lwc:if={hasRows}>
                <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-m-top_x-small" data-id="range">{rangeText}</p>
            </template>
        </div>
    </article>
</template>
