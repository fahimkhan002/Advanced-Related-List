<template>
    <lightning-modal-header label={heading}></lightning-modal-header>
    <lightning-modal-body>
        <lightning-record-form
            record-id={recordId}
            object-api-name={objectApiName}
            fields={formFields}
            layout-type={layoutType}
            columns="2"
            mode="edit"
            onsuccess={handleSuccess}
            oncancel={handleCancel}
        ></lightning-record-form>
    </lightning-modal-body>
</template>
